name: Build Wave Runner Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Prepare permanent APK filename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Wave-Runner.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wave-Runner-Android-APK
          path: Wave-Runner.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish permanent GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Wave Runner — APK permanente
          body: "APK Android mais recente do Wave Runner. O link do arquivo permanece disponível até a release ser removida."
          files: Wave-Runner.apk
          overwrite_files: true
          make_latest: true
